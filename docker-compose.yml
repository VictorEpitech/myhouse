services:
  codex-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-epitech-moulins
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-${PORT:-4223}}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_PORT=3000
      - VITE_AZURE_CLIENT_ID=${VITE_AZURE_CLIENT_ID:-}
      - VITE_AZURE_AUTHORITY=${VITE_AZURE_AUTHORITY:-https://login.microsoftonline.com/organizations}
      - VITE_AZURE_TENANT_ID=${VITE_AZURE_TENANT_ID:-organizations}
      - VITE_AZURE_REDIRECT_URI=${VITE_AZURE_REDIRECT_URI:-https://codex.techmoulins.fr}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-victor1.granger@epitech.eu}
      - DATABASE_PATH=/app/data/codex.db
    volumes:
      # Volume persistant pour la base de données SQLite
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
